# Loki — log toplama.
#
# Tek düğüm, dosya sistemi depolaması. Ölçeklenme hedefi yok: amaç konteyner yeniden
# başlayınca log geçmişinin kaybolmasını önlemek ve aramayı mümkün kılmak.
#
# Saklama 7 gün (168h). Süresiz saklamak diski doldurur; compactor süresi dolanı siler.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
