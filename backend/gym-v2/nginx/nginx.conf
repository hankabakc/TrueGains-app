events {}

http {
    # Statik dosya servisi icin ZORUNLU. Bu yapilandirma once yalnizca vekillik
    # yapiyordu, o yuzden hic gerekmemisti; panel eklenince .js dosyalari
    # "text/plain" olarak servis edildi ve tarayici modulu reddetti.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # WebSocket yükseltmesi için gerekli eşleme (sohbet /ws üzerinden STOMP kullanıyor).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gymapp_backend {
        server backend:8082;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gymapp_backend;
            proxy_http_version 1.1;

            # ══ KRİTİK SATIR ══
            # `$remote_addr` ile **EZİLİYOR**, `$proxy_add_x_forwarded_for` ile
            # EKLENMİYOR. Eklenseydi istemcinin gönderdiği başlık listenin başında
            # kalırdı; uygulama ilk değeri okuduğu için saldırgan her istekte farklı bir
            # IP uydurup hız sınırını tamamen atlatabilirdi.
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Sohbet bağlantısı uzun ömürlü; varsayılan 60 sn kopma yaratıyordu.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ── Yönetim paneli ────────────────────────────────────────────────────────
    # Panel AYNI KÖKENDEN servis ediliyor: statik dosyalar ve /api aynı host/port
    # üzerinde. Böylece tarayıcı açısından çapraz köken çağrısı yok, backend'in
    # CORS listesini panel için genişletmek gerekmiyor — o liste dar kalmalı.
    #
    # Ayrıca panel artık Vite geliştirme sunucusuna bağımlı değil; nginx ayakta
    # olduğu sürece çalışır.
    server {
        listen 80;
        server_name admin.localhost;

        root /usr/share/nginx/admin;
        index index.html;

        # Panel arama motorlarına kapalı.
        add_header X-Robots-Tag "noindex, nofollow" always;

        location /api/ {
            proxy_pass http://gymapp_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # `$host` DEGIL `$http_host`: `$host` portu dusuruyor. Spring istegin
            # adresini Host basligindan kuruyor; port dusunce adres
            # "http://admin.localhost" oluyor, tarayicinin Origin'i ise
            # "http://admin.localhost:8082". Portlar tutmayinca AYNI KOKEN olan
            # istek capraz koken sayiliyor ve CORS listesinde olmadigi icin 403
            # doniyordu. `$http_host` portu da tasiyor, adres birebir esitleniyor.
            proxy_set_header Host $http_host;
        }

        # Tek sayfalık uygulama: bilinmeyen yollar index.html'e düşer ki
        # yönlendirici (router) devralabilsin.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
