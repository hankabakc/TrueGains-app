# Authentication Success Messages
messages.auth.register.success=Kayıt başarıyla tamamlandı.
messages.auth.login.success=Giriş başarılı.
messages.auth.refresh.success=Token başarıyla yenilendi.
messages.auth.logout.success=Başarıyla çıkış yapıldı.
messages.auth.forgot-password.success=E-posta kayıtlıysa doğrulama kodu gönderildi.
messages.auth.reset-password.success=Şifreniz başarıyla güncellendi.

# Authentication Error Messages
error.auth.bad-credentials=Geçersiz e-posta veya şifre.
error.auth.email-in-use=Bu e-posta adresi zaten kullanımda.
error.auth.invalid-refresh-token=Geçersiz Refresh Token.
error.auth.refresh-token-expired=Refresh Token süresi dolmuş.
error.auth.refresh-token-missing=Yenileme token'ı (Refresh Token) bulunamadı veya geçersiz.
error.auth.user-not-found=Kullanıcı bulunamadı.
error.auth.invalid-role=Bu rol ile kayıt yapılamaz.
error.auth.invalid-otp=Doğrulama kodu geçersiz veya hatalı. Lütfen e-posta adresinize gelen 6 haneli kodu doğru girdiğinizden emin olun.
error.auth.forgot-password.user-not-found=Sistemde bu e-posta adresi ile kayıtlı bir kullanıcı bulunamadı.
# Sayi AuthenticationService.LOCKOUT_MINUTES ile ayni; biri degisirse digeri de degisir.
error.auth.account-locked=Hesabınız çok sayıda hatalı giriş nedeniyle geçici olarak kilitlendi. En geç 15 dakika sonra tekrar deneyin.
error.auth.account-disabled=Hesabınız kapatılmış. Bilgi almak için destek ile iletişime geçin.

# System Error Messages
error.system.critical=Sistemde beklenmedik bir hata oluştu. Lütfen daha sonra tekrar deneyiniz.
