# =====================================================
# GYMAPP-V2 Spring Boot Konfigürasyonu
# =====================================================

# Sunucu Yapılandırması
# Varsayılan 8082 korunur; compose'da host'un 8082'si vekile ait olduğu için
# backend'i ayrıca Maven'dan koşarken SERVER_PORT ile başka bir port verilebilir.
server.port=${SERVER_PORT:8082}
server.address=0.0.0.0

# Java 25 Virtual Threads
spring.threads.virtual.enabled=true

# =====================================================
# VERİTABANI (Environment Variables Üzerinden Okunur)
# =====================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Baglanti havuzu acikca ayarlanir. Varsayilan 10'du ve hicbir yerde yazmiyordu; bu yuzden
# "kac es zamanli istek tasiyabiliriz" sorusunun cevabi bilinmiyordu. Deger, PostgreSQL
# max_connections ile birlikte dusunulmelidir (varsayilan 100): birden fazla instance
# calisacaksa instance basina havuz * instance sayisi < max_connections olmalidir.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# Havuz tukendiginde istek sonsuza kadar beklemez; 10 sn sonra hata verir. Boylece yavas
# bir dis servis tum uygulamayi sessizce kilitlemek yerine gorunur hata uretir.
spring.datasource.hikari.connection-timeout=10000
# Sizinti tespiti: bir baglanti 30 sn'den uzun tutulursa stack trace ile loglanir.
spring.datasource.hikari.leak-detection-threshold=30000

# open-in-view KAPALI. Acik birakilirsa veritabani baglantisi yanit uretilene kadar
# tutulur: yavas bir istemci veya buyuk bir JSON, havuzdaki baglantiyi is bitmis olsa bile
# mesgul eder. Kapatmak, baglantinin islem biter bitmez birakilmasini saglar.
#
# Kapatmanin bedeli: islem disinda tembel yukleme yapan uclar LazyInitializationException
# ile kirilir. Kapatmadan once calisan uygulamada 28 GET ucu tarandi ve once/sonra durum
# kodlari karsilastirildi (bkz. GUNLUK 17.08.2026).
# Baglantinin Gemini cagrisi boyunca tutulmasi sorunu bu ayardan bagimsiz cozuldu:
# GeminiVisionService metotlarindan @Transactional kaldirildi, Hibernate islem disinda
# baglanti tutmuyor.
spring.jpa.open-in-view=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tembel yuklenen iliskiler tek tek degil toplu cekilir: N kayit icin N sorgu yerine
# tek IN sorgusu uretilir. Ic ice koleksiyonlar (program -> gun -> egzersiz) tek
# JOIN FETCH ile cekilemedigi icin N+1'i onleyen yol budur.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Sayfa boyutu tavani. Pageable dogrudan controller imzalarindan geliyor ve istemci
# ?size=100000 gonderebiliyordu. Spring varsayilani 2000; listelenen kayitlar sifreli PII
# icerdigi icin daha dar tutuluyor.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =====================================================
# GÜVENLİK (Environment Variables Üzerinden Okunur)
# =====================================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=86400000
app.security.encryption.key=${ENCRYPTION_KEY}

app.security.waf.enabled=true

# Gemini AI Konfigürasyonu
gemini.api.key=${GEMINI_API_KEY}

# Sentry Monitoring & Tracing
sentry.dsn=${SENTRY_DSN}
sentry.traces-sample-rate=1.0
sentry.exception-resolver-order=-2147483648
spring.autoconfigure.exclude=io.sentry.spring.boot.jakarta.SentryAutoConfiguration

# Swagger Konfigürasyonu
app.swagger.enabled=false
springdoc.swagger-ui.path=/swagger

# Dosya Yükleme Limitleri (Fotoğraf Analizi İçin Kritik)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Firebase Konfigürasyonu
firebase.credential.path=${FIREBASE_CREDENTIAL_PATH:classpath:firebase-adminsdk.json}

# Rate Limiting (Geliştirme süreci ve dinamik işlemler için esnetildi)
app.security.rate-limit.capacity=100

# =====================================================
# ISLETIM UCLARI (Actuator) — AYRI YONETIM PORTU
# =====================================================
# Actuator uclari API portunda (8082) DEGIL, ayri bir yonetim portunda yayinlanir.
# Sebep: /actuator/prometheus istek sayilari, gecikme, JVM bellek, havuz doluluk gibi
# ic isletim bilgisini tasir. API portunda yayinlansaydi ya internete acilacakti ya da
# Prometheus'a uygulama kimligi vermek gerekecekti. Yonetim portu compose aginda kalir,
# `ports:` ile disari acilmaz — boylece uc yalnizca ic agdan erisilebilir.
#
# Orkestrator saglik yoklamasi da bu porta yapilir (compose healthcheck).
management.server.port=${MANAGEMENT_PORT:9090}

# Yalnizca health ve prometheus. env/beans/configprops surum, ortam degiskeni ve ic
# yapilandirma sizdirir; ihtiyac dogdukca tek tek acilir.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# Ayrinti (veritabani durumu vb.) disariya verilmez: "UP"/"DOWN" yeter.
management.endpoint.health.show-details=never

# =====================================================
# ISTEMCI SURUM KILIDI
# =====================================================
# API sozlesmesini bozan her dagitimda min surum yukseltilir. Ortam degiskeniyle
# override edilebilir; yeniden derleme gerekmez.
app.client.min-supported-version=${MIN_CLIENT_VERSION:1.0.0}
app.client.latest-version=${LATEST_CLIENT_VERSION:1.0.0}

# --- Yonetim paneli: Sentry ozeti -------------------------------------------
# Jeton SUNUCUDA kalir, tarayiciya inmez. Tanimli degilse hata ucu
# "yapilandirilmamis" der ve panel calismaya devam eder.
admin.sentry.token=${SENTRY_AUTH_TOKEN:}
admin.sentry.organization=${SENTRY_ORG:}
admin.sentry.backend-project=${SENTRY_BACKEND_PROJECT:}
admin.sentry.mobile-project=${SENTRY_MOBILE_PROJECT:}
admin.sentry.base-url=${SENTRY_BASE_URL:https://de.sentry.io}

# --- Ilk yonetici hesabi ----------------------------------------------------
# Kaynakta hesap bilgisi tutulmaz. Ikisi de verilirse ve veritabaninda HIC yonetici
# yoksa acilista bir kez olusturulur (AdminBootstrap). Yonetici varsa dokunulmaz.
app.admin.bootstrap.email=${ADMIN_EMAIL:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}
