# =====================================================
# Test Profile Configurations (H2 In-Memory)
# =====================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled in test to prevent postgreSQL specific SQL dialect errors in H2
spring.flyway.enabled=false

# Mock Security Properties - YALNIZCA TEST. Degerler acikca "test-only" diyor: onceki
# degerler gelistirme ortamindaki anahtarla ayni kaliptaydi ve kaynakta onu ele veriyordu.
# jwt.secret: Base64("test-only-jwt-signing-key-not-for-production-use"), 48 bayt
app.security.jwt.secret=dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNl
# encryption.key: AES-256, tam 32 bayt
app.security.encryption.key=test-only-encryption-key-32chars
app.security.waf.enabled=false
app.swagger.enabled=false
# Testler tek IP'den cok istek atar; varsayilan limitler testleri rastgele 429'a dusurur.
app.security.rate-limit.capacity=10000
app.security.rate-limit.auth-capacity=10000

gemini.api.key=mock-key
sentry.dsn=
firebase.credential.path=classpath:firebase-adminsdk.json
