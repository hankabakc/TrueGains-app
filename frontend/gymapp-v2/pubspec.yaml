name: gymapp_v2
description: "Modernized Gym Application with Flutter 3.41 and BLoC"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  dio: ^5.7.0
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.8
  get_it: ^8.0.2
  injectable: ^2.5.0
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  uuid: ^4.5.3
  stomp_dart_client: ^3.0.1
  go_router: ^14.8.1
  image_picker: ^1.2.1
  url_launcher: ^6.3.0
  mobile_scanner: ^6.0.4
  flutter_rating_bar: ^4.0.1
  fl_chart: ^1.2.0
  flutter_localizations:
    sdk: flutter
  intl_phone_field: ^3.2.0
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.1.1
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  # 9.x zorunlu: 8.x'in Android tarafı Kotlin dil sürümünü 1.6'ya sabitliyor ve
  # Kotlin 2.2+ bunu artık derlemiyor ("Language version 1.6 is no longer supported").
  sentry_flutter: ^9.27.0
  sentry_dio: ^9.27.0
  flutter_local_notifications: ^21.0.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.1
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.5
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/exercises/
    - assets/branding/

# Uygulama ikonu: assets/branding altindaki kaynaklardan tum boyutlar uretilir.
# Yeniden uretmek icin: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0D0F12"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true
